name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build for Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      enabled: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
      - name: Check that GitHub Pages is enabled
        id: pages
        uses: actions/configure-pages@v6
        continue-on-error: true
      - name: Explain how to enable Pages
        if: steps.pages.outcome != 'success'
        run: |
          echo "::notice title=GitHub Pages is not enabled::Turn it on in Settings > Pages > Build and deployment > Source: GitHub Actions, then re-run this workflow."
          echo "### GitHub Pages is not enabled yet" >> "$GITHUB_STEP_SUMMARY"
          echo "Open **Settings > Pages**, set **Source** to **GitHub Actions**, then re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v7
        if: steps.pages.outcome == 'success'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.pages.outcome == 'success'
        run: npm ci
      - name: Build
        if: steps.pages.outcome == 'success'
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_CHANNEL: pages
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outcome == 'success'
        with:
          path: packages/app/dist

  deploy:
    name: Deploy
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
